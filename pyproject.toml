[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "abc-enterprise-kb"
version = "0.1.0"
description = "Governed knowledge-base prototype with folder entitlements and MCP tools"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["kb*"]

[tool.setuptools.package-data]
kb = ["static/*"]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13,<1"]
email = ["extract-msg>=0.48,<1"]
metadata = ["pyarrow>=18,<24"]
docling = ["docling>=2.142.1,<3", "pdfplumber>=0.11,<1"]

[project.scripts]
abc-kb = "kb.cli:main"
