<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1460" viewBox="0 0 1800 1460"><rect width="100%" height="100%" fill="#f7f9fc"/><text x="45" y="68" font-family="Arial,sans-serif" font-size="38" fill="#14283c" font-weight="700">Knowledge solution · Data flow</text><text x="45" y="107" font-family="Arial,sans-serif" font-size="21" fill="#526578" font-weight="400">Implementation view · 6 November 2026 · Top lanes: left to right · Debug views: parallel</text><text x="45" y="169" font-family="Arial,sans-serif" font-size="24" fill="#14283c" font-weight="700">01  INGESTION  |  file to searchable evidence</text><rect x="45" y="194" width="320" height="201" fill="#ffffff" stroke="#d4dce5"/><rect x="45" y="194" width="320" height="5" fill="#226a8d" stroke="#226a8d"/><text x="60" y="237" font-family="Arial,sans-serif" font-size="23" fill="#14283c" font-weight="700">Upload + approval</text><text x="60" y="275" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Maker uploads file + metadata</text><text x="60" y="304" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Garage: staged original</text><text x="60" y="333" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">SQLite: document + request</text><text x="60" y="362" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Independent checker approves</text><path d="M369,295 h22 m-7,-5 l7,5 -7,5" fill="none" stroke="#52718c" stroke-width="2"/><rect x="393" y="194" width="320" height="201" fill="#ffffff" stroke="#d4dce5"/><rect x="393" y="194" width="320" height="5" fill="#226a8d" stroke="#226a8d"/><text x="408" y="237" font-family="Arial,sans-serif" font-size="23" fill="#14283c" font-weight="700">Local PDF extraction</text><text x="408" y="275" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">pypdf: electronic text</text><text x="408" y="304" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">pdfplumber: ruled tables</text><text x="408" y="333" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Docling: layout + object crops</text><text x="408" y="362" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Scan regions: overlapping tiles</text><path d="M717,295 h22 m-7,-5 l7,5 -7,5" fill="none" stroke="#52718c" stroke-width="2"/><rect x="741" y="194" width="320" height="201" fill="#ffffff" stroke="#d4dce5"/><rect x="741" y="194" width="320" height="5" fill="#226a8d" stroke="#226a8d"/><text x="756" y="237" font-family="Arial,sans-serif" font-size="23" fill="#14283c" font-weight="700">Visual interpretation</text><text x="756" y="275" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Approved crops → OpenRouter</text><text x="756" y="304" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Free VL models → paid Qwen*</text><text x="756" y="333" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Validate structured response</text><text x="756" y="362" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Keep source IDs + bounding boxes</text><path d="M1065,295 h22 m-7,-5 l7,5 -7,5" fill="none" stroke="#52718c" stroke-width="2"/><rect x="1089" y="194" width="320" height="201" fill="#ffffff" stroke="#d4dce5"/><rect x="1089" y="194" width="320" height="5" fill="#226a8d" stroke="#226a8d"/><text x="1104" y="237" font-family="Arial,sans-serif" font-size="23" fill="#14283c" font-weight="700">Chunks + embeddings</text><text x="1104" y="275" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Store parsed content + chunks</text><text x="1104" y="304" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Approved text → embedding model</text><text x="1104" y="333" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Validate vector dimensions</text><text x="1104" y="362" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Guardrail failure stops this run</text><path d="M1413,295 h22 m-7,-5 l7,5 -7,5" fill="none" stroke="#52718c" stroke-width="2"/><rect x="1437" y="194" width="320" height="201" fill="#ffffff" stroke="#d4dce5"/><rect x="1437" y="194" width="320" height="5" fill="#226a8d" stroke="#226a8d"/><text x="1452" y="237" font-family="Arial,sans-serif" font-size="23" fill="#14283c" font-weight="700">Index + publish</text><text x="1452" y="275" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">OpenSearch: text + vectors</text><text x="1452" y="304" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">SQLite publishes generation</text><text x="1452" y="333" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Only published chunks retrieved</text><text x="1452" y="362" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Old generation survives failure</text><text x="45" y="459" font-family="Arial,sans-serif" font-size="24" fill="#14283c" font-weight="700">02  QUESTION ANSWERING  |  question to cited answer</text><rect x="45" y="484" width="320" height="201" fill="#ffffff" stroke="#d4dce5"/><rect x="45" y="484" width="320" height="5" fill="#226a8d" stroke="#226a8d"/><text x="60" y="527" font-family="Arial,sans-serif" font-size="23" fill="#14283c" font-weight="700">Question + planning</text><text x="60" y="565" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Employee signs in; session checked</text><text x="60" y="594" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Simple ask: straight to search</text><text x="60" y="623" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Compound ask: LLM planner splits it</text><text x="60" y="652" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">MCP tools resolve folder grants</text><path d="M369,585 h22 m-7,-5 l7,5 -7,5" fill="none" stroke="#52718c" stroke-width="2"/><rect x="393" y="484" width="320" height="201" fill="#ffffff" stroke="#d4dce5"/><rect x="393" y="484" width="320" height="5" fill="#226a8d" stroke="#226a8d"/><text x="408" y="527" font-family="Arial,sans-serif" font-size="23" fill="#14283c" font-weight="700">Retrieve evidence</text><text x="408" y="565" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">MCP searchdocuments, per part</text><text x="408" y="594" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Question → text embedding</text><text x="408" y="623" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">OpenSearch BM25 + text k-NN</text><text x="408" y="652" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Rank fusion + folder filters</text><path d="M717,585 h22 m-7,-5 l7,5 -7,5" fill="none" stroke="#52718c" stroke-width="2"/><rect x="741" y="484" width="320" height="201" fill="#ffffff" stroke="#d4dce5"/><rect x="741" y="484" width="320" height="5" fill="#226a8d" stroke="#226a8d"/><text x="756" y="527" font-family="Arial,sans-serif" font-size="23" fill="#14283c" font-weight="700">Validate source</text><text x="756" y="565" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">MCP getdocsection, per hit</text><text x="756" y="594" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">SQL checks chunk hashes + status</text><text x="756" y="623" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Check retention + source lineage</text><text x="756" y="652" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Reject stale / unauthorized hits</text><path d="M1065,585 h22 m-7,-5 l7,5 -7,5" fill="none" stroke="#52718c" stroke-width="2"/><rect x="1089" y="484" width="320" height="201" fill="#ffffff" stroke="#d4dce5"/><rect x="1089" y="484" width="320" height="5" fill="#226a8d" stroke="#226a8d"/><text x="1104" y="527" font-family="Arial,sans-serif" font-size="23" fill="#14283c" font-weight="700">Generate + verify</text><text x="1104" y="565" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Evidence → OpenRouter answer</text><text x="1104" y="594" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Validate citation IDs</text><text x="1104" y="623" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Model checks claim grounding</text><text x="1104" y="652" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Recheck current folder access</text><path d="M1413,585 h22 m-7,-5 l7,5 -7,5" fill="none" stroke="#52718c" stroke-width="2"/><rect x="1437" y="484" width="320" height="201" fill="#ffffff" stroke="#d4dce5"/><rect x="1437" y="484" width="320" height="5" fill="#226a8d" stroke="#226a8d"/><text x="1452" y="527" font-family="Arial,sans-serif" font-size="23" fill="#14283c" font-weight="700">Release answer</text><text x="1452" y="565" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Recheck session + permissions</text><text x="1452" y="594" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Show answer + source citations</text><text x="1452" y="623" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Expose permitted tool trace</text><text x="1452" y="652" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Withhold if required checks fail</text><text x="45" y="749" font-family="Arial,sans-serif" font-size="24" fill="#14283c" font-weight="700">03  DEBUGGING  |  parallel views of pipeline and search data</text><rect x="45" y="774" width="320" height="201" fill="#ffffff" stroke="#d4dce5"/><rect x="45" y="774" width="320" height="5" fill="#226a8d" stroke="#226a8d"/><text x="60" y="817" font-family="Arial,sans-serif" font-size="23" fill="#14283c" font-weight="700">Capture geometry</text><text x="60" y="855" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">After parsing, before model calls</text><text x="60" y="884" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">SQLite audit: PDF layout snapshot</text><text x="60" y="913" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Object ID + type + page + bbox</text><text x="60" y="942" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">No PDF text in geometry snapshot</text><rect x="393" y="774" width="320" height="201" fill="#ffffff" stroke="#d4dce5"/><rect x="393" y="774" width="320" height="5" fill="#226a8d" stroke="#226a8d"/><text x="408" y="817" font-family="Arial,sans-serif" font-size="23" fill="#14283c" font-weight="700">Retain artifacts</text><text x="408" y="855" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Garage: original per request</text><text x="408" y="884" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Parsed JSON + visual crops</text><text x="408" y="913" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Curated chunk JSON</text><text x="408" y="942" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Legacy runs: crop geometry only</text><rect x="741" y="774" width="320" height="201" fill="#ffffff" stroke="#d4dce5"/><rect x="741" y="774" width="320" height="5" fill="#226a8d" stroke="#226a8d"/><text x="756" y="817" font-family="Arial,sans-serif" font-size="23" fill="#14283c" font-weight="700">PDF object inspector</text><text x="756" y="855" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Select PDF run + page</text><text x="756" y="884" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Local PDFium renders source</text><text x="756" y="913" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">SVG boxes overlay the page</text><text x="756" y="942" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Select box, layer, zoom; export</text><rect x="1089" y="774" width="320" height="201" fill="#ffffff" stroke="#d4dce5"/><rect x="1089" y="774" width="320" height="5" fill="#226a8d" stroke="#226a8d"/><text x="1104" y="817" font-family="Arial,sans-serif" font-size="23" fill="#14283c" font-weight="700">Ingestion monitor</text><text x="1104" y="855" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">SQLite: request + live progress</text><text x="1104" y="884" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Audit: error + model excerpts</text><text x="1104" y="913" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Maker/checker retries unchanged</text><text x="1104" y="942" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">approval without new review</text><rect x="1437" y="774" width="320" height="201" fill="#ffffff" stroke="#d4dce5"/><rect x="1437" y="774" width="320" height="5" fill="#226a8d" stroke="#226a8d"/><text x="1452" y="817" font-family="Arial,sans-serif" font-size="23" fill="#14283c" font-weight="700">Search diagnostics</text><text x="1452" y="855" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">OpenSearch → Query Insights</text><text x="1452" y="884" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Top-query latency → Dashboards</text><text x="1452" y="913" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Slowlog → local query viewer</text><text x="1452" y="942" font-family="Arial,sans-serif" font-size="18" fill="#14283c" font-weight="400">Search latency ≠ total chat time</text><rect x="45" y="1032" width="1710" height="159" fill="#eaf0f5" stroke="#eaf0f5"/><text x="65" y="1074" font-family="Arial,sans-serif" font-size="24" fill="#14283c" font-weight="700">Where data lives</text><text x="65" y="1116" font-family="Arial,sans-serif" font-size="21" fill="#14283c" font-weight="400">SQLite  →  identities, grants, approvals, progress, audit, chunk manifests and published-generation pointer</text><text x="65" y="1153" font-family="Arial,sans-serif" font-size="21" fill="#14283c" font-weight="400">Garage S3  →  files and artifacts          OpenSearch  →  searchable chunks, vectors and query insights</text><text x="45" y="1244" font-family="Arial,sans-serif" font-size="24" fill="#14283c" font-weight="700">External boundary &amp; failure behavior</text><text x="45" y="1282" font-family="Arial,sans-serif" font-size="20" fill="#526578" font-weight="400">Only approved text/crops go to OpenRouter. Local rendering and the PDF inspector do not call models.</text><text x="45" y="1316" font-family="Arial,sans-serif" font-size="20" fill="#526578" font-weight="400">* Every model task is an ordered chain: free models first, paid only under price ceilings. A 429, 5xx or invalid reply moves to the next model.</text><text x="45" y="1350" font-family="Arial,sans-serif" font-size="20" fill="#526578" font-weight="400">Current pdf-hybrid profile: new writes require real text vectors; retained legacy generations remain readable.</text><text x="45" y="1384" font-family="Arial,sans-serif" font-size="20" fill="#526578" font-weight="400">Image embeddings are disabled in this profile. Original PDF inspection requires folder maker/checker/owner/delegate role.</text></svg>